<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-schedule · ZZZ mockup v2 (blind build from spec)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ---------- tokens (spec §2, §3) ---------- */
:root{
  --bg-base:#101114; --bg-panel:#1A1B1F; --bg-raised:#23252A; --line:#353940;
  --text:#FFFFFF; --text-muted:#A3A6AB;
  --accent:#E5FE10; --accent-ink:#101114;
  --warn:#FF6600; --danger:#FF3B30; --info:#00E5FF;
  --paper:#EAE6DF;
  --font-display:"Anton","Prompt",sans-serif;
  --font-body:"Prompt",system-ui,sans-serif;
  --font-mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  --snap:cubic-bezier(.2,.9,.2,1);
  --t:150ms;
  --hh:64px;            /* height of one hour in week board */
  --tone-acid:#E5FE10; --tone-orange:#FF6600; --tone-sky:#00E5FF;
  --tone-violet:#B98CFF; --tone-yellow:#FFC400; --tone-paper:#EAE6DF;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-base);color:var(--text);font:400 14px/1.5 var(--font-body);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* grain (spec §5.7) */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.045;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}

.ghost{position:fixed;left:-2vw;bottom:-6vw;font:400 clamp(200px,30vw,520px)/.8 var(--font-display);color:#fff;opacity:.045;pointer-events:none;user-select:none;z-index:0;letter-spacing:-.02em;white-space:nowrap}

.app{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:22px clamp(14px,2.4vw,36px) 48px}

/* ---------- top strip ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:2px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{font:400 18px/1 var(--font-display);letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:9999px}
.stamp{font:600 11px/1.2 var(--font-mono);letter-spacing:.16em;color:var(--text-muted);text-transform:uppercase}
.stamp em{font-style:normal;color:var(--text)}
.demo{font:600 9px/1 var(--font-mono);letter-spacing:.14em;color:var(--warn);border:1px solid var(--warn);padding:2px 5px;margin-left:6px;vertical-align:1px}
.mode{display:flex;gap:6px;align-items:center}
.pill{border:1px solid var(--line);background:transparent;padding:8px 16px;border-radius:9999px;font:600 12px/1 var(--font-body);letter-spacing:.04em;cursor:pointer;color:var(--text-muted);
  transition:background var(--t) var(--snap),color var(--t) var(--snap),border-color var(--t) var(--snap)}
.pill:hover{background:var(--bg-raised);color:var(--text)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ---------- header ---------- */
.head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:24px}
.eyebrow{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.eyebrow b{font:400 14px/1 var(--font-display);letter-spacing:.12em;color:var(--accent)}
.chev{font:400 14px/1 var(--font-display);color:var(--text-muted);letter-spacing:-.1em}
h1{margin:0;font:400 clamp(60px,9vw,136px)/.95 var(--font-display);text-transform:uppercase;transform:skewX(-8deg);transform-origin:left bottom;letter-spacing:.005em}
h1 .out{color:transparent;-webkit-text-stroke:2px var(--text)}
.th-title{margin:12px 0 0;font:800 20px/1.3 var(--font-body)}
.th-sub{margin:2px 0 0;color:var(--text-muted);font-size:13px}

.clock{text-align:right}
.clock .date{font:400 clamp(56px,7vw,96px)/.85 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock .date small{font-size:.42em;color:var(--accent);margin-left:8px;letter-spacing:.06em}
.clock .time{font:600 13px/1 var(--font-mono);letter-spacing:.2em;color:var(--text-muted);margin-top:8px}
.clock .time b{color:var(--text);font-weight:600}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
main{min-width:0}

/* ---------- side: NOW deck (diegetic VHS cassette) ---------- */
.deck{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px;align-items:stretch}
.vhs{position:relative;background:var(--bg-panel);border:2px solid var(--line);box-shadow:4px 4px 0 #000;padding:16px 16px 18px 46px;
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.vhs::after{ /* halftone corner, spec §5.2 */
  content:"";position:absolute;right:0;bottom:0;width:150px;height:110px;pointer-events:none;opacity:.14;
  background-image:radial-gradient(circle,var(--text) 1.1px,transparent 1.4px);background-size:7px 7px;
  -webkit-mask-image:linear-gradient(315deg,#000 10%,transparent 70%);mask-image:linear-gradient(315deg,#000 10%,transparent 70%)}
.spine{position:absolute;left:0;top:0;bottom:0;width:30px;background:var(--bg-raised);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:600 10px/1 var(--font-mono);letter-spacing:.32em;color:var(--text-muted);white-space:nowrap}
.vhs-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tape{display:inline-block;font:400 15px/1 var(--font-display);letter-spacing:.08em;padding:6px 12px 5px;transform:rotate(-4deg);background:var(--accent);color:var(--accent-ink)}
.tape.ghosted{background:transparent;color:var(--text);border:1px solid var(--text)}
.rec{font:600 10px/1 var(--font-mono);letter-spacing:.18em;color:var(--text-muted)}
.rec i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-right:6px;vertical-align:0}
.now-time{font:400 44px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.01em;margin:6px 0 4px}
.now-name{font:800 17px/1.35 var(--font-body);margin:0 0 6px}
.now-meta{font:600 11px/1.5 var(--font-mono);letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase}
.now-meta b{color:var(--text);font-weight:600}
.gauge{margin-top:16px}
.gauge-row{display:flex;justify-content:space-between;font:600 10px/1 var(--font-mono);letter-spacing:.16em;color:var(--text-muted);margin-bottom:6px}
.gauge-row b{color:var(--text)}
.bar{height:14px;background:var(--bg-base);border:1px solid var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;width:0;
  background:repeating-linear-gradient(-45deg,var(--accent) 0 7px,var(--accent-ink) 7px 14px); /* the ONE hazard stripe on the page */
  transition:width .4s var(--snap)}
.empty-now{border:1px dashed var(--line);padding:14px;margin-top:6px;color:var(--text-muted);font-size:13px;
  background:linear-gradient(to top right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px)),
             linear-gradient(to bottom right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px))}
.empty-now span{background:var(--bg-panel);padding:2px 6px}

.queue{background:var(--bg-panel);border:1px solid var(--line);padding:14px 16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px}
.sec-h h2{margin:0;font:400 20px/1 var(--font-display);letter-spacing:.06em}
.sec-h span{font:600 10px/1 var(--font-mono);letter-spacing:.16em;color:var(--text-muted)}
.q-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;cursor:pointer}
.q-item:hover .q-name{color:var(--accent)}
.q-day{font:400 15px/1 var(--font-display);letter-spacing:.06em;color:var(--text-muted);width:34px}
.q-name{font:600 13px/1.35 var(--font-body);transition:color var(--t) var(--snap)}
.q-name small{display:block;font:600 10px/1.4 var(--font-mono);letter-spacing:.08em;color:var(--text-muted)}
.q-time{font:400 16px/1 var(--font-display);font-variant-numeric:tabular-nums}

.files{background:var(--bg-panel);border:1px solid var(--line);padding:14px 16px}
.file{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:7px 0;cursor:pointer;text-align:left}
.file i{width:6px;align-self:stretch;min-height:22px;background:var(--tone)}
.file span{flex:1;font:600 12px/1.35 var(--font-body)}
.file code{font:600 10px/1 var(--font-mono);letter-spacing:.08em;color:var(--text-muted)}
.file:hover span{color:var(--accent)}

/* ---------- main: week board ---------- */
.board-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.filters{display:flex;gap:6px}
.count{font:600 11px/1 var(--font-mono);letter-spacing:.16em;color:var(--text-muted)}
.count b{font:400 22px/1 var(--font-display);color:var(--text);letter-spacing:.02em;margin-right:4px}

.board{background:var(--bg-panel);border:2px solid var(--line);box-shadow:4px 4px 0 #000;overflow-x:auto}
.week{display:grid;grid-template-columns:150px minmax(0,1fr);min-width:1160px}
.dh{position:relative;padding:14px 14px 12px 16px;border-bottom:1px solid var(--line);border-right:2px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.dh.corner{border-bottom:2px solid var(--line);padding:0 14px;align-items:flex-start}
.dh.corner span{font:600 9px/1 var(--font-mono);letter-spacing:.14em;color:var(--text-muted)}
.dtab{display:block;width:100%;border:0;cursor:pointer;background:var(--bg-raised);color:var(--text-muted);padding:8px 12px;transform:skewX(-10deg);text-align:left;
  transition:background var(--t) var(--snap),color var(--t) var(--snap)}
.dtab>span{display:flex;justify-content:space-between;align-items:baseline;transform:skewX(10deg)}
.dtab b{font:400 24px/1 var(--font-display);letter-spacing:.05em}
.dtab small{font:600 10px/1 var(--font-mono);letter-spacing:.1em}
.dtab:hover{background:#2C2F35;color:var(--text)}
.dh.today .dtab{background:var(--accent);color:var(--accent-ink)}
.dh .th-day{display:block;margin-top:7px;font-size:12px;color:var(--text-muted);padding-left:4px}
.dh .stk{position:absolute;right:8px;top:4px;z-index:2;font:400 11px/1 var(--font-display);letter-spacing:.1em;background:var(--accent-ink);color:var(--accent);border:1px solid var(--accent);padding:4px 7px 3px;transform:rotate(-5deg)}

.axis{position:relative;height:40px;border-bottom:2px solid var(--line)}
.axis span{position:absolute;bottom:9px;transform:translateX(-50%);font:400 17px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--text-muted)}
.axis span.first{transform:translateX(6px)}
.axis span.last{transform:translateX(calc(-100% - 6px))}
.col{position:relative;height:156px;border-bottom:1px solid var(--line);
  background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px),linear-gradient(90deg,rgba(53,57,64,.45) 1px,transparent 1px);
  background-size:calc(100%/12) 100%,calc(100%/24) 100%}
.col.today{background-color:rgba(229,254,16,.025)}
.col-empty{position:absolute;inset:10px 8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(to top right,transparent calc(50% - .5px),rgba(53,57,64,.8) 50%,transparent calc(50% + .5px)),
             linear-gradient(to bottom right,transparent calc(50% - .5px),rgba(53,57,64,.8) 50%,transparent calc(50% + .5px))}
.col-empty b{font:400 26px/1 var(--font-display);letter-spacing:.08em;background:var(--bg-panel);padding:4px 10px}
.col-empty span{font-size:12px;color:var(--text-muted);background:var(--bg-panel);padding:2px 8px}

.nowline{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--accent);z-index:0;pointer-events:none}
.nowline::before{content:"";position:absolute;top:-1px;left:-6px;width:10px;height:10px;background:var(--accent);clip-path:polygon(0 0,100% 0,50% 100%)}
.nowline b{display:none}

/* class card (spec §4, §7) */
.card{position:absolute;z-index:1;top:9px;bottom:9px;border:0;text-align:left;cursor:pointer;background:var(--bg-raised);color:var(--text);
  padding:9px 10px 9px 15px;display:flex;flex-direction:column;gap:3px;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);
  box-shadow:inset 0 0 0 1px var(--line);
  transition:transform var(--t) var(--snap),background var(--t) var(--snap);
  animation:enter .32s var(--snap) both;animation-delay:calc(var(--i)*40ms)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tone)}
.card:hover{transform:translate(-2px,-2px);background:#2C2F35}
.card:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--accent)}
.card .c-time{align-self:flex-start;padding-right:44px;font:400 21px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.card .c-name{font:600 13px/1.38 var(--font-body);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.card .c-meta{margin-top:auto;font:600 10px/1.35 var(--font-mono);letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase}
.c-meta .nb{white-space:nowrap;margin-right:8px}
.chip{position:absolute;right:16px;top:9px;font:600 9px/1 var(--font-mono);letter-spacing:.12em;padding:4px 8px;border-radius:9999px;border:1px solid var(--text-muted);color:var(--text-muted)}
.chip.lab{border-color:var(--info);color:var(--info)}
.card .c-name{-webkit-line-clamp:3}
.card.short .chip{top:auto;bottom:9px}
.card.short .c-time{padding-right:0}
.card.short .c-meta{padding-right:40px}
.card.is-now{box-shadow:inset 0 0 0 3px var(--accent)}
.card.is-now .pip{position:absolute;width:8px;height:8px;background:var(--accent)}
.card.dim{opacity:.22;pointer-events:none}
@keyframes enter{from{opacity:0;transform:translateX(-14px) skewX(-8deg)}to{opacity:1;transform:none}}

/* ---------- dossier drawer (binder paper object) ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:20;opacity:0;pointer-events:none;transition:opacity var(--t) var(--snap)}
.scrim.open{opacity:1;pointer-events:auto}
.dossier{position:fixed;top:24px;right:24px;bottom:24px;width:min(440px,calc(100vw - 32px));z-index:21;background:var(--paper);color:var(--accent-ink);
  box-shadow:8px 8px 0 #000;padding:28px 26px 26px 54px;overflow:auto;
  clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,0 100%);
  transform:translateX(calc(100% + 120px)) skewX(-4deg);visibility:hidden;transition:transform .18s var(--snap),visibility 0s linear .18s}
.dossier.open{transform:none;visibility:visible;transition:transform .18s var(--snap),visibility 0s}
.holes{position:absolute;left:18px;top:60px;display:flex;flex-direction:column;gap:70px}
.holes i{width:16px;height:16px;border-radius:50%;background:var(--bg-base)}
.close{position:absolute;right:34px;top:18px;width:38px;height:38px;border-radius:50%;border:0;background:var(--danger);color:#fff;cursor:pointer;font:400 20px/1 var(--font-display);display:grid;place-items:center}
.close:hover{transform:translate(-2px,-2px);box-shadow:2px 2px 0 #000}
.d-code{font:600 11px/1 var(--font-mono);letter-spacing:.2em}
.d-bars{display:flex;gap:2px;height:22px;margin:10px 0 18px}
.d-bars i{background:var(--accent-ink)}
.d-kicker{font:400 15px/1 var(--font-display);letter-spacing:.1em;display:flex;gap:8px;align-items:center}
.d-kicker i{width:22px;height:8px;background:var(--tone);display:inline-block;outline:1px solid var(--accent-ink)}
.d-name{margin:8px 0 18px;font:800 26px/1.3 var(--font-body)}
.d-grid{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--accent-ink)}
.d-grid div{padding:10px 0;border-bottom:1px solid rgba(16,17,20,.25)}
.d-grid div:nth-child(odd){padding-right:10px}
.d-grid small{display:block;font:600 9px/1 var(--font-mono);letter-spacing:.18em;color:#4A4C50;margin-bottom:5px}
.d-grid b{font:600 15px/1.3 var(--font-body)}
.d-sess-h{margin:22px 0 8px;font:400 18px/1 var(--font-display);letter-spacing:.08em}
.d-sess{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 12px;margin-bottom:6px;background:#fff;border:1px solid var(--accent-ink);
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.d-sess b{font:400 20px/1 var(--font-display);letter-spacing:.05em}
.d-sess span{font:400 18px/1 var(--font-display);font-variant-numeric:tabular-nums}
.d-sess small{font:600 10px/1.3 var(--font-mono);letter-spacing:.06em;color:#4A4C50}
.d-sess em{font-style:normal;font:600 9px/1 var(--font-mono);letter-spacing:.12em;padding:4px 8px;border-radius:9999px;border:1px solid var(--accent-ink)}
.d-foot{margin-top:22px;font:600 9px/1.6 var(--font-mono);letter-spacing:.14em;color:#4A4C50}

/* ---------- mobile day list ---------- */
.mtabs{display:none}
.mlist{display:none}
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .deck{position:static;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .deck .vhs{grid-column:1/-1}
}
@media (max-width:700px){
  .head{grid-template-columns:1fr}
  .clock{text-align:left;display:flex;align-items:baseline;gap:14px}
  .clock .time{margin:0}
  h1{font-size:58px}
  .deck{grid-template-columns:1fr}
  .files{display:none}
  .board{display:none}
  .board-tools .count{display:none}
  .mtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 10px 6px;margin:0 0 6px}
  .mtabs button{flex:0 0 auto;border:0;cursor:pointer;background:var(--bg-panel);color:var(--text-muted);padding:10px 16px;transform:skewX(-10deg);font:400 18px/1 var(--font-display);letter-spacing:.06em}
  .mtabs button span{display:inline-block;transform:skewX(10deg)}
  .mtabs button[aria-selected="true"]{background:var(--text);color:var(--accent-ink)}
  .mtabs button.today{box-shadow:inset 0 -4px 0 var(--accent)}
  .mtabs button.today[aria-selected="true"]{background:var(--accent)}
  .mlist{display:flex;flex-direction:column;gap:8px}
  .mlist .card{position:relative;top:auto;bottom:auto;left:auto;width:auto;min-height:104px}
  .mlist .card .chip{top:9px;bottom:auto}
  .mlist .card .c-name{-webkit-line-clamp:unset}
  .mlist .col-empty{position:relative;inset:auto;height:160px}
  .mday-h{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
  .mday-h b{font:400 34px/1 var(--font-display);letter-spacing:.04em}
  .mday-h span{color:var(--text-muted);font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="ghost" aria-hidden="true" id="ghost">WK00</div>

<div class="app">
  <div class="top">
    <div class="brand">
      <span class="brand-mark">MY—SCHEDULE</span>
      <span class="stamp">FILE <em id="serial">SCH-0000</em> // AY 2569 · TERM 2<span class="demo">DEMO</span></span>
    </div>
    <div class="mode" role="group" aria-label="โหมดเวลา">
      <span class="stamp" style="margin-right:4px">CLOCK</span>
      <button class="pill" data-mode="live" aria-pressed="true">LIVE</button>
      <button class="pill" data-mode="demo" aria-pressed="false">DEMO · MON 15:40</button>
    </div>
  </div>

  <header class="head">
    <div>
      <div class="eyebrow"><b>DATA FILE</b><span class="chev">&gt;&gt;</span><span class="stamp">WEEKLY TIMETABLE</span></div>
      <h1>Weekly<br><span class="out">Schedule</span></h1>
      <p class="th-title">ตารางเรียนประจำสัปดาห์</p>
      <p class="th-sub">6 วิชา · 11 คาบ · จันทร์ถึงศุกร์ 09:00–21:00</p>
    </div>
    <div class="clock" aria-live="polite">
      <div class="date" id="clkDate">--/--<small>---</small></div>
      <div class="time">LOCAL <b id="clkTime">--:--</b></div>
    </div>
  </header>

  <div class="layout">
    <!-- side deck -->
    <aside class="deck">
      <section class="vhs" aria-labelledby="nowTag">
        <div class="spine"><span>NOW PLAYING // SIDE A</span></div>
        <div class="vhs-label">
          <span class="tape" id="nowTag">NOW</span>
          <span class="rec"><i></i>REC</span>
        </div>
        <div id="nowBody"></div>
      </section>

      <section class="queue">
        <div class="sec-h"><h2>UP NEXT</h2><span>QUEUE &gt;&gt;</span></div>
        <div id="queue"></div>
      </section>

      <section class="files">
        <div class="sec-h"><h2>COURSE FILES</h2><span id="fileCount">06</span></div>
        <div id="files"></div>
      </section>
    </aside>

    <!-- main board -->
    <main>
      <div class="board-tools">
        <div class="filters" role="group" aria-label="กรองประเภทคาบ">
          <button class="pill" data-f="ALL" aria-pressed="true">ทั้งหมด</button>
          <button class="pill" data-f="LEC" aria-pressed="false">LEC บรรยาย</button>
          <button class="pill" data-f="LAB" aria-pressed="false">LAB ปฏิบัติ</button>
        </div>
        <div class="count"><b id="hrs">00</b>HRS / WEEK</div>
      </div>

      <div class="mtabs" role="tablist" id="mtabs"></div>
      <div class="mlist" id="mlist"></div>

      <div class="board"><div class="week" id="week"></div></div>
    </main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="dossier" id="dossier" role="dialog" aria-modal="true" aria-labelledby="dName" aria-hidden="true">
  <div class="holes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <button class="close" id="close" aria-label="ปิด">×</button>
  <div id="dBody"></div>
</aside>

<script>
/* data copied from components/schedule-data.ts */
const DAYS=[
  {id:"mon",short:"จ.",en:"MON",name:"วันจันทร์",idx:"01"},
  {id:"tue",short:"อ.",en:"TUE",name:"วันอังคาร",idx:"02"},
  {id:"wed",short:"พ.",en:"WED",name:"วันพุธ",idx:"03"},
  {id:"thu",short:"พฤ.",en:"THU",name:"วันพฤหัสบดี",idx:"04"},
  {id:"fri",short:"ศ.",en:"FRI",name:"วันศุกร์",idx:"05"}];
const CLASSES=[
 {name:"อินเทอร์เน็ตในทุกสิ่ง",code:"10301361",day:"mon",start:"10:00",end:"12:00",room:"Lab คอม2 (105)",section:"1",type:"LEC"},
 {name:"วิศวกรรมการพัฒนาปฏิบัติการบนคลาวด์",code:"10301347",day:"mon",start:"13:00",end:"15:00",room:"Lab คอม2 (105)",section:"1",type:"LEC"},
 {name:"การออกกำลังกายเพื่อเสริมสร้างสมรรถภาพ",code:"10700252",day:"mon",start:"15:00",end:"17:00",room:"สังคม 202 (102)",section:"11",type:"LEC"},
 {name:"การประยุกต์ใช้โปรแกรมสำเร็จรูปทางธุรกิจ",code:"10200503",day:"mon",start:"17:00",end:"21:00",room:"BA 206 (107)",section:"7",type:"LEC"},
 {name:"วิศวกรรมการพัฒนาปฏิบัติการบนคลาวด์",code:"10301347",day:"tue",start:"09:00",end:"12:00",room:"Lab คอม2 (105)",section:"1",type:"LAB"},
 {name:"การสร้างสรรค์และนวัตกรรม",code:"10307121",day:"tue",start:"13:00",end:"15:00",room:"วิทย์ 2205 (105)",section:"1",type:"LEC"},
 {name:"นานาสาระเกี่ยวกับอาหารและยา",code:"10400406",day:"tue",start:"15:00",end:"16:30",room:"ศร301 (125)",section:"1",type:"LEC"},
 {name:"อินเทอร์เน็ตในทุกสิ่ง",code:"10301361",day:"thu",start:"10:00",end:"13:00",room:"Lab คอม2 (105)",section:"1",type:"LAB"},
 {name:"การออกกำลังกายเพื่อเสริมสร้างสมรรถภาพ",code:"10700252",day:"thu",start:"15:00",end:"17:00",room:"สังคม 202 (102)",section:"11",type:"LAB"},
 {name:"การสร้างสรรค์และนวัตกรรม",code:"10307121",day:"fri",start:"13:00",end:"15:00",room:"วิทย์ 2205 (105)",section:"1",type:"LAB"},
 {name:"นานาสาระเกี่ยวกับอาหารและยา",code:"10400406",day:"fri",start:"15:00",end:"16:30",room:"ศร301 (125)",section:"1",type:"LEC"}];
const TONE={"10301361":"acid","10301347":"orange","10700252":"sky","10200503":"violet","10307121":"yellow","10400406":"paper"};
const START=9, END=21;

const $=s=>document.querySelector(s);
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const pad=n=>String(n).padStart(2,"0");
const tone=c=>`var(--tone-${TONE[c]})`;
const dur=c=>(toMin(c.end)-toMin(c.start))/60;
const esc=s=>s.replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const COURSES=[...new Map(CLASSES.map(c=>[c.code,c])).values()];

let mode="live", filter="ALL", mDay=null;

function clockNow(){
  if(mode==="demo"){const d=new Date();const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);d.setHours(15,40,0,0);return d}
  return new Date();
}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function state(){
  const d=clockNow(), wd=(d.getDay()+6)%7;         // 0=Mon
  const todayIdx=wd<5?wd:-1, mins=d.getHours()*60+d.getMinutes();
  const sorted=[...CLASSES].sort((a,b)=>DAYS.findIndex(x=>x.id===a.day)-DAYS.findIndex(x=>x.id===b.day)||toMin(a.start)-toMin(b.start));
  const abs=c=>DAYS.findIndex(x=>x.id===c.day)*1440+toMin(c.start);
  const nowAbs=(todayIdx<0?7*1440:wd*1440)+mins;
  const cur=todayIdx<0?null:CLASSES.find(c=>c.day===DAYS[todayIdx].id&&toMin(c.start)<=mins&&mins<toMin(c.end));
  let upcoming=sorted.filter(c=>abs(c)>nowAbs);
  if(upcoming.length<3) upcoming=upcoming.concat(sorted).slice(0,3+0); // wrap to next week
  return {d,todayIdx,mins,cur,upcoming:upcoming.filter(c=>c!==cur).slice(0,3),nowAbs,abs};
}

/* ---------- renderers ---------- */
function cardHTML(c,i,cls=""){
  const s=state(); const isNow=s.cur===c;
  const short=dur(c)<2?" short":"";
  const dim=filter!=="ALL"&&c.type!==filter?" dim":"";
  return `<button class="card${short}${dim}${isNow?" is-now":""} ${cls}" style="--tone:${tone(c.code)};--i:${i}" data-code="${c.code}"
    aria-label="${esc(c.name)} ${c.start} ถึง ${c.end} ห้อง ${esc(c.room)}">
    <span class="chip ${c.type==="LAB"?"lab":""}">${c.type}</span>
    <span class="c-time">${c.start}–${c.end}</span>
    <span class="c-name">${esc(c.name)}</span>
    <span class="c-meta"><span class="nb">${esc(c.room)}</span> <span class="nb">SEC ${c.section}</span> <span class="nb">${c.code}</span></span>
  </button>`;
}
function emptyHTML(){return `<div class="col-empty"><b>NO CLASS</b><span>ไม่มีคาบเรียน</span></div>`}

function renderWeek(){
  const s=state(), span=END-START, pct=m=>((m/60-START)/span*100).toFixed(4);
  let h=`<div class="dh corner"><span>DAY / TIME</span></div><div class="axis">`;
  for(let k=START;k<=END;k++)h+=`<span class="${k===START?"first":k===END?"last":""}" style="left:${((k-START)/span*100).toFixed(4)}%">${pad(k)}</span>`;
  h+=`</div>`;
  let n=0;
  DAYS.forEach((d,i)=>{
    const t=i===s.todayIdx, cs=CLASSES.filter(c=>c.day===d.id);
    h+=`<div class="dh ${t?"today":""}">${t?'<span class="stk">TODAY</span>':""}
      <button class="dtab" data-jump="${d.id}"><span><b>${d.en}</b><small>${d.idx}</small></span></button>
      <span class="th-day">${d.name}</span></div>`;
    h+=`<div class="col ${t?"today":""}" id="col-${d.id}">`;
    if(!cs.length)h+=emptyHTML();
    cs.forEach(c=>{
      const l=pct(toMin(c.start)), w=(dur(c)/span*100).toFixed(4);
      h+=cardHTML(c,n++).replace('style="',`style="left:calc(${l}% + 3px);width:calc(${w}% - 6px);`);
    });
    if(t&&s.mins>=START*60&&s.mins<=END*60)h+=`<div class="nowline" style="left:${pct(s.mins)}%"></div>`;
    h+=`</div>`;
  });
  $("#week").innerHTML=h;
}

function renderMobile(){
  const s=state();
  if(mDay===null)mDay=s.todayIdx<0?0:s.todayIdx;
  $("#mtabs").innerHTML=DAYS.map((d,i)=>`<button role="tab" aria-selected="${i===mDay}" class="${i===s.todayIdx?"today":""}" data-m="${i}"><span>${d.en}</span></button>`).join("");
  const d=DAYS[mDay], cs=CLASSES.filter(c=>c.day===d.id).sort((a,b)=>toMin(a.start)-toMin(b.start));
  $("#mlist").innerHTML=`<div class="mday-h"><b>${d.en}</b><span>${d.name}${mDay===s.todayIdx?" · วันนี้":""}</span></div>`+
    (cs.length?cs.map((c,i)=>cardHTML(c,i)).join(""):emptyHTML());
}

function renderDeck(){
  const s=state(), c=s.cur;
  $("#nowTag").textContent=c?"NOW":"FREE";
  $("#nowTag").className="tape"+(c?"":" ghosted");
  if(c){
    const p=Math.min(100,Math.max(0,(s.mins-toMin(c.start))/(toMin(c.end)-toMin(c.start))*100));
    const left=toMin(c.end)-s.mins;
    $("#nowBody").innerHTML=`
      <div class="now-time">${c.start}–${c.end}</div>
      <p class="now-name">${esc(c.name)}</p>
      <div class="now-meta">ROOM <b>${esc(c.room)}</b><br>SEC <b>${c.section}</b> · ${c.type} · ${c.code}</div>
      <div class="gauge"><div class="gauge-row"><span>PROGRESS</span><b>${Math.floor(left/60)}H ${pad(left%60)}M LEFT</b></div>
        <div class="bar" role="progressbar" aria-valuenow="${Math.round(p)}" aria-valuemin="0" aria-valuemax="100" aria-label="ความคืบหน้าคาบนี้"><i style="width:${p}%"></i></div></div>`;
  }else{
    const nx=s.upcoming[0]; let wait="";
    if(nx){let diff=s.abs(nx)-s.nowAbs; if(diff<0)diff+=7*1440; wait=`${Math.floor(diff/60)}H ${pad(diff%60)}M`}
    $("#nowBody").innerHTML=`
      <div class="now-time">--:--</div>
      <div class="empty-now"><span>ตอนนี้ไม่มีคาบเรียน</span></div>
      ${nx?`<div class="gauge"><div class="gauge-row"><span>NEXT IN</span><b>${wait}</b></div>
      <div class="now-meta" style="margin-top:4px">&gt;&gt; <b>${DAYS.find(x=>x.id===nx.day).en} ${nx.start}</b> ${esc(nx.name)}</div></div>`:""}`;
  }
  $("#queue").innerHTML=s.upcoming.map(c=>`<button class="q-item" data-code="${c.code}">
      <span class="q-day">${DAYS.find(x=>x.id===c.day).en}</span>
      <span class="q-name">${esc(c.name)}<small>${esc(c.room)} · ${c.type}</small></span>
      <span class="q-time">${c.start}</span></button>`).join("");
  $("#files").innerHTML=COURSES.map(c=>`<button class="file" data-code="${c.code}" style="--tone:${tone(c.code)}"><i></i><span>${esc(c.name)}</span><code>${c.code}</code></button>`).join("");
}

function renderClock(){
  const d=clockNow();
  $("#clkDate").innerHTML=`${pad(d.getDate())}/${pad(d.getMonth()+1)}<small>${["SUN","MON","TUE","WED","THU","FRI","SAT"][d.getDay()]}</small>`;
  $("#clkTime").textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const wk=isoWeek(d);
  $("#ghost").textContent="WK"+pad(wk);
  $("#serial").textContent=`SCH-${d.getFullYear()}-W${pad(wk)}`;
}

function renderAll(){
  renderClock();renderDeck();renderWeek();renderMobile();
  const hrs=CLASSES.filter(c=>filter==="ALL"||c.type===filter).reduce((a,c)=>a+dur(c),0);
  $("#hrs").textContent=pad(Math.round(hrs*10)/10);
}

/* ---------- dossier ---------- */
let lastFocus=null;
function openDossier(code){
  const c=COURSES.find(x=>x.code===code), ss=CLASSES.filter(x=>x.code===code);
  const bars=[...code].map(ch=>`<i style="width:${1+(+ch%4)}px"></i><i style="width:${1+((+ch+2)%3)}px;background:transparent"></i>`).join("");
  $("#dBody").innerHTML=`
    <div class="d-code">COURSE FILE · ${code}</div>
    <div class="d-bars" aria-hidden="true">${bars}${bars}</div>
    <div class="d-kicker" style="--tone:${tone(code)}"><i></i>DOSSIER</div>
    <h2 class="d-name" id="dName">${esc(c.name)}</h2>
    <div class="d-grid">
      <div><small>CODE</small><b>${code}</b></div>
      <div><small>SECTION</small><b>${[...new Set(ss.map(x=>x.section))].join(", ")}</b></div>
      <div><small>ROOM</small><b>${[...new Set(ss.map(x=>x.room))].map(esc).join(", ")}</b></div>
      <div><small>HOURS / WEEK</small><b>${ss.reduce((a,x)=>a+dur(x),0)} ชม.</b></div>
    </div>
    <div class="d-sess-h">SESSIONS &gt;&gt;</div>
    ${ss.map(x=>`<div class="d-sess"><b>${DAYS.find(d=>d.id===x.day).en}</b><div><span>${x.start}–${x.end}</span><br><small>${esc(x.room)}</small></div><em>${x.type}</em></div>`).join("")}
    <div class="d-foot">SOURCE: components/schedule-data.ts<br>NOT AN OFFICIAL REGISTRATION RECORD</div>`;
  lastFocus=document.activeElement;
  $("#dossier").classList.add("open");$("#scrim").classList.add("open");
  $("#dossier").setAttribute("aria-hidden","false");
  setTimeout(()=>$("#close").focus(),40);
}
function closeDossier(){
  $("#dossier").classList.remove("open");$("#scrim").classList.remove("open");
  $("#dossier").setAttribute("aria-hidden","true");
  if(lastFocus)lastFocus.focus();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const card=e.target.closest("[data-code]"); if(card&&!e.target.closest("#dossier")){openDossier(card.dataset.code);return}
  const f=e.target.closest("[data-f]"); if(f){filter=f.dataset.f;document.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",b===f));renderAll();return}
  const m=e.target.closest("[data-mode]"); if(m){mode=m.dataset.mode;mDay=null;document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b===m));renderAll();return}
  const t=e.target.closest("[data-m]"); if(t){mDay=+t.dataset.m;renderMobile();return}
  const j=e.target.closest("[data-jump]"); if(j){const col=$("#col-"+j.dataset.jump);col&&col.querySelector(".card")?.focus();return}
});
$("#close").onclick=closeDossier; $("#scrim").onclick=closeDossier;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#dossier").classList.contains("open"))closeDossier()});
/* preview hooks: #demo, #demo&open=10301347 */
if(location.hash.includes("demo")){mode="demo";document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode==="demo"))}
renderAll();
{const o=location.hash.match(/open=(\d+)/);if(o)openDossier(o[1])}
setInterval(()=>{renderClock();renderDeck();},30000);
</script>
</body>
</html>
