<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-schedule · ZZZ mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#101114; --bg-panel:#1a1b1f; --bg-raised:#23252a; --line:#353940;
  --text:#fff; --text-muted:#a3a6ab;
  --accent:#e5fe10; --accent-ink:#101114;
  --warn:#ff6600; --danger:#ff3b30; --info:#00e5ff;
  --font-display:"Anton","Prompt",sans-serif;
  --font-body:"Prompt",system-ui,sans-serif;
  --font-mono:"Cascadia Mono",Consolas,monospace;
  --snap:cubic-bezier(.2,.9,.2,1);
  --cut:14px;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg-base);color:var(--text);font:400 14px/1.45 var(--font-body);min-height:100vh;overflow-x:hidden;position:relative}
/* grain */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.wm{position:absolute;top:-40px;right:-20px;font:400 clamp(220px,32vw,460px)/1 var(--font-display);color:#fff;opacity:.05;letter-spacing:-.02em;pointer-events:none;user-select:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:28px clamp(16px,3vw,40px) 48px}

/* header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.serial{font:600 11px/1 var(--font-mono);letter-spacing:.18em;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px;display:flex;gap:14px;align-items:center}
.serial i{display:inline-block;width:56px;height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,var(--bg-base) 6px 12px)}
h1{font:400 clamp(52px,8vw,104px)/.9 var(--font-display);text-transform:uppercase;letter-spacing:.01em;transform:skewX(-8deg);transform-origin:left bottom}
h1 span{color:var(--accent)}
.th-sub{font:800 18px/1.2 var(--font-body);margin-top:12px}
.stats{display:flex;gap:12px}
.stat{background:var(--bg-panel);border:1px solid var(--line);padding:12px 18px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);min-width:96px}
.stat b{display:block;font:400 44px/1 var(--font-display);font-variant-numeric:tabular-nums}
.stat small{font:600 10px/1 var(--font-mono);letter-spacing:.16em;color:var(--text-muted);text-transform:uppercase}

/* day tabs + filters */
.bar{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.tabs{display:flex;gap:6px}
.tab{font:400 22px/1 var(--font-display);letter-spacing:.04em;padding:12px 22px;background:var(--bg-panel);color:var(--text-muted);border:0;cursor:pointer;
  transform:skewX(-14deg);transition:background .15s var(--snap),color .15s var(--snap),transform .15s var(--snap)}
.tab>span{display:inline-block;transform:skewX(14deg)}
.tab:hover{background:var(--bg-raised);color:var(--text)}
.tab.active{background:var(--accent);color:var(--accent-ink)}
.tab:focus-visible,.pill:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.pills{display:flex;gap:8px}
.pill{font:600 13px/1 var(--font-body);padding:10px 18px;border-radius:9999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;transition:all .15s var(--snap)}
.pill:hover{background:var(--bg-raised)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* grid */
.board{background:var(--bg-panel);border:1px solid var(--line);box-shadow:6px 6px 0 #000;padding:0 0 0 0;overflow-x:auto}
.grid{display:grid;grid-template-columns:132px repeat(12,minmax(88px,1fr));min-width:1180px}
.cell-h{font:400 22px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--text-muted);padding:14px 0 14px 10px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell-h.corner{border-left:0;font:600 10px/1 var(--font-mono);letter-spacing:.16em;display:flex;align-items:center}
.day-label{display:flex;flex-direction:column;justify-content:center;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg-base);position:relative}
.day-label b{font:400 28px/1 var(--font-display);letter-spacing:.03em}
.day-label small{font:600 11px/1.3 var(--font-body);color:var(--text-muted)}
.day-label.today{background:var(--accent);color:var(--accent-ink)}
.day-label.today small{color:#3a3d00}
.tape{position:absolute;right:-6px;top:8px;background:var(--accent-ink);color:var(--accent);font:600 9px/1 var(--font-mono);letter-spacing:.14em;padding:4px 8px;transform:rotate(-5deg)}
.track{grid-column:2/-1;border-bottom:1px solid var(--line);min-height:112px;position:relative;
  background:repeating-linear-gradient(90deg,transparent 0 calc(100%/12 - 1px),var(--line) calc(100%/12 - 1px) calc(100%/12))}

/* class card */
.card{position:absolute;top:8px;bottom:8px;background:var(--bg-raised);padding:10px 12px 10px 16px;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);
  transition:transform .15s var(--snap),background .15s var(--snap)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tone)}
.card:hover{transform:translate(-2px,-2px);background:#2c2f35}
.card .t{font:400 24px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap}
.card .n{font:800 13px/1.4 var(--font-body);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font:600 10px/1.3 var(--font-mono);letter-spacing:.06em;color:#c3c6ca;margin-top:auto;text-transform:uppercase;position:absolute;left:16px;right:10px;bottom:8px;white-space:normal;line-height:1.25}
.card .ty{position:absolute;right:22px;top:8px;font:600 9px/1 var(--font-mono);letter-spacing:.12em;padding:4px 8px;border-radius:9999px;border:1px solid var(--text-muted);color:var(--text-muted)}
.card .ty.lab{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card.now{outline:3px solid var(--accent);outline-offset:-3px}

/* bottom dock */
.dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;display:flex;gap:6px;background:#000;padding:8px;border-radius:9999px;border:1px solid var(--line)}
.dock .pill{padding:10px 20px}
.legend{margin-top:18px;display:flex;gap:18px;flex-wrap:wrap;font:600 11px/1 var(--font-mono);letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

.mlist{display:none}
@media (max-width:760px){
  .board,.legend,.pills{display:none}
  .mlist{display:block}
  .stats{width:100%}.stat{flex:1;min-width:0;padding:8px 12px}.stat b{font-size:30px}
  header{margin-bottom:16px}.th-sub{font-size:15px}
  .bar{margin-bottom:14px}.tabs{width:100%;overflow-x:auto;padding:2px 8px 6px 0}
  .tab{font-size:18px;padding:10px 16px}
  .mday{margin-bottom:22px}
  .mday>h2{font:400 30px/1 var(--font-display);letter-spacing:.03em;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
  .mday>h2 small{font:600 12px var(--font-body);color:var(--text-muted)}
  .mday .card{position:relative;top:auto;bottom:auto;left:auto;width:auto;display:block;margin-bottom:8px;padding:12px 14px 14px 18px}
  .mday .card .m{position:static;margin-top:10px;white-space:normal}
  .mday .card .n{-webkit-line-clamp:unset}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wm" aria-hidden="true">02</div>
<div class="wrap">
  <header>
    <div>
      <div class="serial"><span>TERM 2/2569</span><i></i><span>SEC-01 // WEEKLY</span></div>
      <h1>Class<br><span>Schedule</span></h1>
      <div class="th-sub">ตารางเรียน ภาคการศึกษาที่ 2/2569</div>
    </div>
    <div class="stats">
      <div class="stat"><b>06</b><small>Courses</small></div>
      <div class="stat"><b>11</b><small>Sessions</small></div>
      <div class="stat"><b>05</b><small>Days</small></div>
    </div>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab"><span>MON</span></button>
      <button class="tab" role="tab"><span>TUE</span></button>
      <button class="tab" role="tab"><span>WED</span></button>
      <button class="tab" role="tab"><span>THU</span></button>
      <button class="tab" role="tab"><span>FRI</span></button>
    </div>
    <div class="pills">
      <button class="pill on">ทั้งหมด</button>
      <button class="pill">LEC</button>
      <button class="pill">LAB</button>
    </div>
  </div>

  <div class="board"><div class="grid" id="grid"></div></div>

  <div class="mlist" id="mlist"></div>
  <div class="legend">
    <span><i style="background:#e5fe10"></i>10301361</span>
    <span><i style="background:#ff6600"></i>10301347</span>
    <span><i style="background:#00e5ff"></i>10700252</span>
    <span><i style="background:#b53fe0"></i>10200503</span>
    <span><i style="background:#ffd000"></i>10307121</span>
    <span><i style="background:#eae6df"></i>10400406</span>
  </div>
</div>



<script>
const DAYS=[["mon","MON","วันจันทร์"],["tue","TUE","วันอังคาร"],["wed","WED","วันพุธ"],["thu","THU","วันพฤหัสบดี"],["fri","FRI","วันศุกร์"]];
const TONES={"10301361":"#e5fe10","10301347":"#ff6600","10700252":"#00e5fff","10200503":"#b53fe0","10307121":"#ffd000","10400406":"#eae6df"};
TONES["10700252"]="#00e5ff";
const C=[
["อินเทอร์เน็ตในทุกสิ่ง","10301361","mon","10:00","12:00","Lab คอม2 (105)","1","LEC"],
["วิศวกรรมการพัฒนาปฏิบัติการบนคลาวด์","10301347","mon","13:00","15:00","Lab คอม2 (105)","1","LEC"],
["การออกกำลังกายเพื่อเสริมสร้างสมรรถภาพ","10700252","mon","15:00","17:00","สังคม 202 (102)","11","LEC"],
["การประยุกต์ใช้โปรแกรมสำเร็จรูปทางธุรกิจ","10200503","mon","17:00","21:00","BA 206 (107)","7","LEC"],
["วิศวกรรมการพัฒนาปฏิบัติการบนคลาวด์","10301347","tue","09:00","12:00","Lab คอม2 (105)","1","LAB"],
["การสร้างสรรค์และนวัตกรรม","10307121","tue","13:00","15:00","วิทย์ 2205 (105)","1","LEC"],
["นานาสาระเกี่ยวกับอาหารและยา","10400406","tue","15:00","16:30","ศร301 (125)","1","LEC"],
["อินเทอร์เน็ตในทุกสิ่ง","10301361","thu","10:00","13:00","Lab คอม2 (105)","1","LAB"],
["การออกกำลังกายเพื่อเสริมสร้างสมรรถภาพ","10700252","thu","15:00","17:00","สังคม 202 (102)","11","LAB"],
["การสร้างสรรค์และนวัตกรรม","10307121","fri","13:00","15:00","วิทย์ 2205 (105)","1","LAB"],
["นานาสาระเกี่ยวกับอาหารและยา","10400406","fri","15:00","16:30","ศร301 (125)","1","LEC"]
];
const toH=t=>{const[h,m]=t.split(":").map(Number);return h+m/60};
const g=document.getElementById("grid");
let html='<div class="cell-h corner">DAY / TIME</div>';
for(let h=9;h<=20;h++)html+=`<div class="cell-h">${String(h).padStart(2,"0")}</div>`;
DAYS.forEach(([id,short,name],i)=>{
  html+=`<div class="day-label ${i===0?"today":""}"><b>${short}</b><small>${name}</small>${i===0?'<span class="tape">TODAY</span>':""}</div>`;
  html+=`<div class="track">`;
  C.filter(c=>c[2]===id).forEach(c=>{
    const left=(toH(c[3])-9)/12*100,w=(toH(c[4])-toH(c[3]))/12*100;
    html+=`<div class="card" style="left:calc(${left}% + 2px);width:calc(${w}% - 4px);--tone:${TONES[c[1]]}">
      <span class="ty ${c[7]==="LAB"?"lab":""}">${c[7]}</span>
      <div class="t">${c[3]}–${c[4]}</div><div class="n">${c[0]}</div>
      <div class="m">${c[5]} · SEC ${c[6]}</div></div>`;
  });
  html+=`</div>`;
});
g.innerHTML=html;
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active")});
document.querySelectorAll(".pills .pill").forEach(p=>p.onclick=()=>{document.querySelectorAll(".pills .pill").forEach(x=>x.classList.remove("on"));p.classList.add("on")});

const ml=document.getElementById("mlist");let mh="";
DAYS.forEach(([id,short,name])=>{
  const cs=C.filter(c=>c[2]===id).sort((a,b)=>a[3].localeCompare(b[3]));
  if(!cs.length)return;
  mh+=`<section class="mday" id="m-${id}"><h2>${short}<small>${name}</small></h2>`;
  cs.forEach(c=>{mh+=`<div class="card" style="--tone:${TONES[c[1]]}"><span class="ty ${c[7]==="LAB"?"lab":""}">${c[7]}</span><div class="t">${c[3]}–${c[4]}</div><div class="n">${c[0]}</div><div class="m">${c[5]} · SEC ${c[6]}</div></div>`});
  mh+=`</section>`;
});
ml.innerHTML=mh;
document.querySelectorAll(".tab").forEach((t,i)=>t.addEventListener("click",()=>{const el=document.getElementById("m-"+DAYS[i][0]);if(el&&getComputedStyle(ml).display!=="none")el.scrollIntoView({behavior:"smooth"})}));
</script>
</body>
</html>
